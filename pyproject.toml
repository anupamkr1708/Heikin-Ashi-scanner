[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-scanner"
version = "1.3.2"
description = "NSE BB+Heikin-Ashi technical scanner — modular research/production repository"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Repository maintainer" }]

# Pinned, tested versions (not floating ranges). Update deliberately and re-run the full
# regression suite (tests/regression/) before bumping any of these.
dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
    "yfinance>=1.7.0,<2.0",
    "scipy>=1.11",         # yfinance repair (off by default — see config.DataConfig.yfinance_repair)
    "scikit-learn>=1.3",   # also needed by yfinance repair; kept installed so re-enabling it just works
    "requests==2.32.3",
    "duckdb==1.0.0",
    "pyarrow==16.1.0",
    "openpyxl==3.1.4",
    "pytz==2024.1",
    "pydantic==2.7.4",
    "PyYAML==6.0.1",
    "tenacity==8.4.1",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "ruff==0.5.0",
    "mypy==1.10.1",
    "types-PyYAML==6.0.12.20240311",
    "types-python-dateutil==2.9.0.20260807",
    "types-requests==2.32.0.20240622",
    "build==1.2.1",
]

[project.scripts]
nse-update-universe = "nse_scanner.cli.update_universe:main"
nse-ingest-eod = "nse_scanner.cli.ingest_eod:main"
nse-run-scan = "nse_scanner.cli.run_scan:main"
nse-run-research = "nse_scanner.cli.run_research:main"
nse-run-daily = "nse_scanner.cli.run_daily:main"
nse-bootstrap-history = "nse_scanner.cli.bootstrap_history:main"
nse-run-replay = "nse_scanner.cli.run_replay:main"
nse-run-walk-forward = "nse_scanner.cli.run_walk_forward:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true