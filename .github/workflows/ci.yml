name: CI

# Runs on every push/PR. Deliberately requires NO network access to nseindia.com or Yahoo
# Finance — all provider-dependent logic is exercised via tests/fixtures (synthetic, schema-
# representative data) and the --offline-fixture path (PART 56: "CI must NOT fail merely
# because NSE is temporarily unavailable").
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ scripts/ tests/

      - name: Format check (ruff format --diff)
        run: ruff format --check src/ scripts/ tests/

      - name: Type check (mypy)
        run: mypy src/nse_scanner

      - name: Unit + integration tests (offline, fixture-based)
        run: pytest tests/ -v --cov=nse_scanner --cov-report=xml --cov-report=term

      - name: Offline fixture end-to-end smoke test
        run: python scripts/run_daily.py --offline-fixture

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

      - name: Upload offline-fixture report (proves the pipeline produced real output)
        uses: actions/upload-artifact@v4
        with:
          name: offline-fixture-report-${{ matrix.python-version }}
          path: |
            reports/*.xlsx
            reports/*.json
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: pip install build
      - name: Build sdist + wheel
        run: python -m build --sdist --wheel
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 14
